name: Business award scan

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: business-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Google Chrome
        run: |
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb

      - run: npm ci

      # Korean Air's edge rejects real headless Chrome (HTTP2 protocol error), so
      # the collector launches "headed". Xvfb gives it a virtual display so nothing
      # is ever visible anywhere — this runs on GitHub's servers, not a desktop.
      - name: Run business seat scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: xvfb-run --auto-servernum -- node --import tsx scripts/business-scan.ts

      - name: Commit updated results
        run: |
          git config user.name "business-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public-data/business-hits.json
          git diff --cached --quiet || git commit -m "chore: update business seat scan results"
          git push
