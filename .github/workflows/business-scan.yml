name: Business award scan

on:
  schedule:
    # Korean Air opens the date 360 days out at 09:00 KST (00:00 UTC), and that
    # is when a brand-new day's seats exist in full. GitHub's scheduler runs late
    # often enough that one alarm would miss it, so the hour is covered closely
    # and the rest of the day hourly.
    - cron: '2,12,22,40 0 * * *'
    - cron: '17 1-23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: business-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Google Chrome
        run: |
          if ! command -v google-chrome >/dev/null; then
            curl -fsSL https://dl.google.com/linux/linux_signing_key.pub -o /tmp/google-chrome-key.pub
            sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/google-chrome.gpg /tmp/google-chrome-key.pub
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi

      - run: npm ci

      - name: Run business seat scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node --import tsx scripts/business-scan.ts

      - name: Commit updated results
        run: |
          git config user.name "business-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          # A scan runs for a long while, so main usually moved meanwhile — often
          # past the commit this runner checked out. Only the result files are this
          # run's to publish; everything else must stay exactly as main has it.
          # (A soft reset would have kept the stale checkout staged and committed it
          #  as a revert of whatever landed during the scan.)
          mkdir -p /tmp/scan-results
          cp public-data/business-hits.json /tmp/scan-results/ 2>/dev/null || true
          cp public-data/unsupported-routes.json /tmp/scan-results/ 2>/dev/null || true
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/scan-results/*.json public-data/ 2>/dev/null || true
            git add public-data/business-hits.json public-data/unsupported-routes.json
            git diff --cached --quiet && exit 0
            # Nothing outside public-data/ may ever be part of this commit.
            outside=$(git diff --cached --name-only | grep -v '^public-data/' || true)
            if [ -n "$outside" ]; then
              echo "refusing to commit files outside public-data/:"
              echo "$outside"
              exit 1
            fi
            git commit -m "chore: update business seat scan results"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
